, transparent);\n  --shadow-lg: 0 12px 32px color-mix(in srgb, #2d2b2b 22%, transparent);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.grayscale{filter:grayscale(1) contrast(1.08)}\n\n/* ══════════════════════════════════════════════════════════════════════════\n   Components — built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n.hr {\n  height: 2px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { background: var(--color-accent); color: var(--color-bg); }\n.btn-primary:hover { background: var(--color-accent-600); }\n.btn-primary:active { background: var(--color-accent-700); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); justify-content: flex-start; text-align: left; }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* — cards — */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — tags — */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }\n.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }\n.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* — navigation — */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: 2px solid var(--color-divider);\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* — tables — */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 2px solid var(--color-divider);\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid var(--color-divider);\n}\n.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }\n\n/* — dialog — */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);\n  padding: var(--space-4); border-radius: var(- :0; font-size:clamp(30px,5vw,68px); line-height:1.02; font-weight:900; letter-spacing:-0.03em; text-transform:uppercase; max-width:22ch\">Cleaner spaces. Stronger businesses.<\u002Fp>\n      <p style=\"margin:28px 0 0; font-size:11px; font-weight:600; letter-spacing:0.24em\">CLEAN&nbsp; /&nbsp; SAFE&nbsp; /&nbsp; PRODUCTIVE SPACES<\u002Fp>\n    <\u002Fsection>\n\n    <section id=\"reviews\" style=\"padding:clamp(40px,6vw,84px) 0 0\">\n      <div style=\"display:flex; align-items:baseline; justify-content:space-between; gap:24px; flex-wrap:wrap; margin-bottom:38px\">\n        <h2 style=\"margin:0; font-size:clamp(28px,3.4vw,46px); font-weight:800; letter-spacing:-0.025em; text-transform:uppercase\">Reviews<\u002Fh2>\n        <p style=\"margin:0; font-size:11px; font-weight:600; letter-spacing:0.2em; color:#6b6862\">WHAT OUR CLIENTS SAY<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,270px),1fr)); gap:2px; background:transparent; border-top:2px solid #222222; border-bottom:2px solid #222222\">\n        <figure style=\"margin:0; background:#F8F7F2; padding:32px clamp(18px,2vw,30px) 34px; display:flex; flex-direction:column; justify-content:space-between; gap:28px\">\n          <blockquote style=\"margin:0; display:flex; flex-direction:column; gap:18px\">\n            <span style=\"display:block; text-align:center; font-size:26px; line-height:1; letter-spacing:0.18em; color:#2147D8\">★★★★★<\u002Fspan>\n            <p style=\"margin:0; font-size:clamp(16px,1.35vw,18px); line-height:1.6; font-weight:500; color:#222222; text-wrap:pretty\">Our office has never looked this consistent. Same crew every week, they know the space, and nothing gets missed.<\u002Fp>\n          <\u002Fblockquote>\n          <figcaption style=\"border-top:2px solid #222222; padding-top:16px; display:flex; flex-direction:column; gap:6px\">\n            <span style=\"font-size:12px; font-weight:700; letter-spacing:0.16em; color:#22222 2em; color:#6b6862\">MON — SAT&nbsp; /&nbsp; SINCE 2016<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <form sc-camel-on-submit=\"{{ submit }}\" style=\"display:flex; flex-direction:column; gap:0; border-top:2px solid #222222\">\n\n        <p style=\"margin:0; padding:26px 0 14px; font-size:10px; font-weight:700; letter-spacing:0.24em; color:#2147D8\">01 — CONTACT<\u002Fp>\n        <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr)); gap:18px\">\n          <label style=\"display:flex; flex-direction:column; gap:8px\"><span style=\"font-size:11px; font-weight:600; letter-spacing:0.16em\">FULL NAME<\u002Fspan><input type=\"text\" name=\"name\" required=\"required\" placeholder=\"Jane Doe\" style=\"border:none; border-bottom:2px solid #222222; background:transparent; padding:12px 0; font-size:16px; color:#222222\"><\u002Flabel>\n          <label style=\"display:flex; flex-direction:column; gap:8px\"><span style=\"font-size:11px; font-weight:600; letter-spacing:0.16em\">PHONE<\u002Fspan><input type=\"tel\" name=\"phone\" required=\"required\" placeholder=\"416 000 0000\" style=\"border:none; border-bottom:2px solid #222222; background:transparent; padding:12px 0; font-size:16px; color:#222222\"><\u002Flabel>\n          <label style=\"display:flex; flex-direction:column; gap:8px\"><span style=\"font-size:11px; font-weight:600; letter-spacing:0.16em\">EMAIL<\u002Fspan><input type=\"email\" name=\"email\" required=\"required\" placeholder=\"you@company.ca\" style=\"border:none; border-bottom:2px solid #222222; background:transparent; padding:12px 0; font-size:16px; color:#222222\"><\u002Flabel>\n        <\u002Fdiv>\n\n        <p style=\"margin:0; padding:38px 0 14px; font-size:10px; font-weight:700; letter-spacing:0.24em; color:#2147D8\">02 — THE SPACE<\u002Fp>\n        <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr)); gap:18px\">\n          <label style=\"display:flex; flex-direction:column; gap:8px\"><span style=\"font-size:11px; font-weight:600; letter-spacing:0.16em\">PROPERTY TYPE<\u002Fspan>\n            <sc-raw-select name=\"property\" required=\"required\" style=\"border:none; border-bottom:2px solid #222222; background:transparent; padding:12px 0; font-size:16px; color:#222222\">\n              <option value=\"\">Select…<\u002Foption>\n              <sc-for list=\"{{ propertyTypes }}\" as=\"t\" hint-placeholder-count=\"5\"><option value=\"{{ t }}\">{{ t }}<\u002Foption><\u002Fsc-for>\n            <\u002Fsc-raw-select>\n          <\u002Flabel>\n          <label style=\"display:flex; flex-direction:column; gap:8px\"><span style=\"font-size:11px; font-weight:600; letter-spacing:0.16em\">SQUARE FOOTAGE<\u002Fspan><input type=\"text\" name=\"sqft\" placeholder=\"e.g. 4,500\" style=\"border:none; border-bottom:2px solid #222222; background:transparent; padding:12px 0; font-size:16px; color:#222222\"><\u002Flabel>\n          <label style=\"display:flex; flex-direction:column; gap:8px\"><span style=\"font-size:11px; font-weight:600; letter-spacing:0.16em\">ROOMS / WASHROOMS<\u002Fspan><input type=\"text\" name=\"rooms\" placeholder=\"e.g. 8 rooms, 2 washrooms\" style=\"border:none; border-bottom:2px solid #222222; background:transparent; padding:12px 0; font-size:16px; color:#222222\"><\u002Flabel>\n        <\u002Fdiv>\n\n        <p style=\"margin:0; padding:38px 0 14px; font-size:10px; font-weight:700; letter-spacing:0.24em; color:#2147D8\">03 — SERVICE NEEDED<\u002Fp>\n        <div style=\"display:flex; flex-wrap:wrap; gap:2px; background:#D9D9D6; padding:2px\">\n          <sc-for list=\"{{ serviceOptions }}\" as=\"o\" hint-placeholder-count=\"6\">\n            <label style=\"flex:1 1 200px; background:#F8F7F2; padding:16px 18px; display:flex; align-items:center; gap:12px; cursor:pointer; font-size:12.5px; font-weight:600; letter-spacing:0.06em\" style-hover=\"background:#ffffff\"><input type=\"checkbox\" name=\"service\" value=\"{{ o }}\" style=\"accent-color:#2147D8; width:16px; height:16px\">{{ o }}<\u002Flabel>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <p style=\"margin:0; padding:38px 0 14px; font-size:10px; font-weight:700; letter-spacing:0.24em; color:#2147D8\">04 — SCHEDULE<\u002Fp>\n        <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr)); gap:18px\">\n          <label style=\"display:flex; flex-direction:column; gap:8px\"><span style=\"font-size:11px; font-weight:600; letter-spacing:0.16em\">FREQUENCY<\u002Fspan>\n            <sc-raw-select name=\"frequency\" required=\"required\" style=\"border:none; border-bottom:2px solid #222222; background:transparent; padding:12px 0; font-size:16px; color:#222222\">\n              <option value=\"\">Select…<\u002Foption>\n              <sc-for list=\"{{ frequencies }}\" as=\"f\" hint-placeholder-count=\"5\"><option value=\"{{ f }}\">{{ f }}<\u002Foption><\u002Fsc-for>\n            <\u002Fsc-raw-select>\n          <\u002Flabel>\n          <label style=\"display:flex; flex-direction:column; gap:8px\"><span style=\"font-size:11px; font-weight:600; letter-spacing:0.16em\">PREFERRED START DATE<\u002Fspan><input type=\"date\" name=\"date\" style=\"border:none; border-bottom:2px solid #222222; background:transparent; padding:12px 0; font-size:16px; color:#222222\"><\u002Flabel>\n        <\u002Fdiv>\n\n        <p style=\"margin:0; padding:38px 0 14px; font-size:10px; font-weight:700; letter-spacing:0.24em; color:#2147D8\">05 — DETAILS<\u002Fp>\n        <label style=\"display:flex; flex-direction:column; gap:8px\"><span style=\"font-size:11px; font-weight:600; letter-spacing:0.16em\">NOTES<\u002Fspan><textarea name=\"notes\" rows=\"4\" placeholder=\"Access hours, floor types, anything specific.\" style=\"border:2px solid #222222; background:transparent; padding:14px; font-size:16px; color:#222222; resize:vertical\"><\u002Ftextarea><\u002Flabel>\n        <label style=\"display:flex; flex-direction:column; gap:10px; margin-top:22px\"><span style=\"font-size:11px; font-weight:600; letter-spacing:0.16em\">PHOTOS OF THE SPACE (OPTIONAL)<\u002Fspan>\n          <input type=\"file\" name=\"photos\" multiple=\"multiple\" accept=\"image/*\" sc-camel-on-change=\"{{ onFiles }}\" style=\"font-size:14px\">\n          <span style=\"font-size:12px; line-height:1.5; color:#4a4845\">{{ fileNote }}<\u002Fspan>\n        <\u002Flabel>\n\n        <div style=\"display:flex; align-items:center; gap:2px; flex-wrap:wrap; margin-top:40px; border-top:2px solid #222222; padding-top:28px\">\n          <button type=\"submit\" style=\"border:none; background:#2147D8; color:#fff; font-size:12px; font-weight:700; letter-spacing:0.18em; padding:20px 30px; cursor:pointer; display:flex; align-items:center; gap:34px; min-width:250px; white-space:nowrap\" style-hover=\"background:#17349e\">SEND REQUEST <span style=\"font-size:15px\">→<\u002Fspan><\u002Fbutton>\n          <button type=\"button\" sc-camel-on-click=\"{{ goHome }}\" style=\"border:2px solid #222222; background:transparent; color:#222222; font-size:12px; font-weight:700; letter-spacing:0.18em; padding:18px 28px; cursor:pointer\" style-hover=\"border-color:#2147D8; color:#2147D8\">BACK TO SITE<\u002Fbutton>\n        <\u002Fdiv>\n\n        <sc-if value=\"{{ sent }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"margin-top:26px; background:#2147D8; color:#fff; padding:26px 28px\">\n            <p style=\"margin:0; font-size:14px; font-weight:700; letter-spacing:0.14em\">REQUEST READY — YOUR EMAIL APP SHOULD OPEN<\u002Fp>\n            <p style=\"margin:12px 0 0; font-size:14px; line-height:1.6\">If nothing opened, email the details to mtkcleanings@gmail.com or call 437 344 3519. Attach photos to that email if you have them.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fform>\n    <\u002Fdiv>\n  <\u002Fmain>\n  <\u002Fsc-if>\n\n  <footer style=\"margin-top:clamp(40px,6vw,80px); border-top:2px solid #222222; padding:26px 0 40px; display:flex; align-items:center; justify-content:space-between; gap:20px; flex-wrap:wrap\">\n    <div style=\"display:flex; align-items:baseline; gap:14px\">\n      <span style=\"font-size:17px; font-weight:900; color:#2147D8; letter-spacing:-0.01em\">MTK<\u002Fspan>\n      <span style=\"font-size:10px; font-weight:600; letter-spacing:0.24em; color:#222222\">CLEANING SERVICES<\u002Fspan>\n    <\u002Fdiv>\n    <p style=\"margin:0; font-size:10px; font-weight:600; letter-spacing:0.22em; color:#6b6862\">TORONTO, ON&nbsp; &nbsp;/&nbsp; &nbsp;CLEANER SPACES. STRONGER BUSINESSES.<\u002Fp>\n    <p style=\"margin:0; font-size:10px; font-weight:600; letter-spacing:0.22em; color:#6b6862\">© 2026 MTK CLEANING SERVICES<\u002Fp>\n  <\u002Ffooter>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;showStats&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Home page&quot;},&quot;startOnEstimate&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Navigation&quot;}}\">\nclass Component extends DCLogic {\n  state = { page: null, sent: false, files: [], slide: 0, paused: false };\n\n  componentDidMount() {\n    const reduce = typeof window !== 'undefined' && window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;\n    if (!reduce) {\n      this._slideTimer = setInterval(() => {\n        if (!this.state.paused) this.setState({ slide: (this.state.slide + 1) % 3 });\n      }, 4500);\n    }\n  }\n\n  componentWillUnmount() {\n    if (this._slideTimer) clearInterval(this._slideTimer);\n  }\n\n  goSlide(n) {\n    this.setState({ slide: (n + 3) % 3 });\n  }\n\n  get page() {\n    return this.state.page || (this.props.startOnEstimate ? 'estimate' : 'home');\n  }\n\n  nav(page) {\n    this.setState({ page, sent: false });\n    if (typeof window !== 'undefined') window.scrollTo(0, 0);\n  }\n\n  scrollTo(id) {\n    const el = document.getElementById(id);\n    if (!el) return;\n    const top = el.getBoundingClientRect().top + window.scrollY - 90;\n    window.scrollTo({ top: Math.max(top, 0), behavior: 'smooth' });\n  }\n\n  jump(e, id) {\n    if (e && e.preventDefault) e.preventDefault();\n    if (this.page !== 'home') {\n      this.setState({ page: 'home', sent: false });\n      setTimeout(() => this.scrollTo(id), 80);\n    } else {\n      this.scrollTo(id);\n    }\n  }\n\n  renderVals() {\n    const files = this.state.files;\n    return {\n      slide0: this.state.slide === 0,\n      slide1: this.state.slide === 1,\n      slide2: this.state.slide === 2,\n      prevSlide: () => this.goSlide(this.state.slide - 1),\n      nextSlide: () => this.goSlide(this.state.slide + 1),\n      pauseSlides: () => this.setState({ paused: true }),\n      resumeSlides: () => this.setState({ paused: false }),\n      swipeStart: (e) => { this._touchX = e.touches && e.touches[0] ? e.touches[0].clientX : null; },\n      swipeEnd: (e) => {\n        if (this._touchX == null || !e.changedTouches || !e.changedTouches[0]) return;\n        const dx = e.changedTouches[0].clientX - this._touchX;\n        this._touchX = null;\n        if (Math.abs(dx) > 40) this.goSlide(this.state.slide + (dx < 0 ? 1 : -1));\n      },\n      slideDots: [0, 1, 2].map((i) => ({\n        label: 'Show photo ' + (i + 1),\n        active: this.state.slide === i,\n        inactive: this.state.slide !== i,\n        go: () => this.goSlide(i)\n      })),\n      isHome: this.page === 'home',\n      isEstimate: this.page === 'estimate',\n      showStats: this.props.showStats !== false,\n      sent: this.state.sent,\n      goHome: (e) => { if (e && e.preventDefault) e.preventDefault(); this.nav('home'); },\n      goEstimate: (e) => { if (e && e.preventDefault) e.preventDefault(); this.nav('estimate'); },\n      goServices: (e) => this.jump(e, 'services'),\n      goAbout: (e) => this.jump(e, 'about'),\n      goContact: (e) => this.jump(e, 'contact'),\n      onFiles: (e) => this.setState({ files: Array.from(e.target.files || []).map(f => f.name) }),\n      fileNote: files.length\n        ? 'Selected: ' + files.join(', ') + ' — attach these to the email that opens.'\n        : 'Browsers cannot send attachments from a form. Pick files here and we will list them, then attach them to the email that opens.',\n      services: [\n        { num: '01', title: 'Office cleaning', body: 'Nightly or weekly service for occupied offices — desks, kitchens, washrooms, glass and floors, on your access schedule.' },\n        { num: '02', title: 'Post-renovation', body: 'Construction dust removal, fine detailing and a final pass so a finished build is ready to hand over.' },\n        { num: '03', title: 'Move-in / move-out', body: 'Full turnover cleans between tenants — appliances, cabinetry, walls and floors, unit by unit.' },\n        { num: '04', title: 'Custom solutions', body: 'Odd hours, seasonal deep cleans or a scope nobody else wants to quote. Tell us the problem and we will price it.' }\n      ],\n      principles: ['CLEAN', 'MODERN', 'FUNCTIONAL', 'TRUSTED'],\n      propertyTypes: ['Office', 'Retail', 'Post-renovation site', 'House / residential home', 'Other'],\n      serviceOptions: ['Office cleaning', 'Post-renovation', 'Move-in / move-out', 'Window cleaning', 'Custom solutions'],\n      frequencies: ['One-time', 'Weekly', 'Bi-weekly', 'Monthly', 'Daily / nightly'],\n      submit: (e) => {\n        e.preventDefault();\n        const fd = new FormData(e.target);\n        const val = (k) => (fd.get(k) || '').toString().trim() || '—';\n        const picked = fd.getAll('service').join(', ') || '—';\n        const lines = [\n          'Name: ' + val('name'),\n          'Phone: ' + val('phone'),\n          'Email: ' + val('email'),\n          '',\n          'Property type: ' + val('property'),\n          'Square footage: ' + val('sqft'),\n          'Rooms / washrooms: ' + val('rooms'),\n          'Services needed: ' + picked,\n          '',\n          'Frequency: ' + val('frequency'),\n          'Preferred start date: ' + val('date'),\n          '',\n          'Notes: ' + val('notes'),\n          'Photos to attach: ' + (files.length ? files.join(', ') : 'none')\n        ];\n        const href = 'mailto:mtkcleanings@gmail.com?subject=' +\n          encodeURIComponent('Estimate request — ' + val('name')) +\n          '&body=' + encodeURIComponent(lines.join('\\n'));\n        this.setState({ sent: true });\n        if (typeof window !== 'undefined') window.location.href = href;\n      }\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
